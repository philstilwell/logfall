name: Weekly headline scout

on:
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate headline scout report
        run: |
          python scripts/headline_scout.py \
            --days 7 \
            --limit 20 \
            --out reports/headline-scout/latest.md \
            --json-out reports/headline-scout/latest.json
          today="$(date -u +%F)"
          cp reports/headline-scout/latest.md "reports/headline-scout/${today}.md"
          cp reports/headline-scout/latest.json "reports/headline-scout/${today}.json"

      - name: Commit updated report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/headline-scout/
          if git diff --cached --quiet; then
            echo "No report changes to commit."
            exit 0
          fi
          git commit -m "Update weekly headline scout report"
          git push
